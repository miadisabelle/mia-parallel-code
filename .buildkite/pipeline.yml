steps:
  - label: ":debian: Publish .deb to miadi-apt"
    if: build.tag != null
    command: |
      apt-get update -qq && apt-get install -y -qq python3 make g++ fakeroot >/dev/null
      npm ci
      npm run build
      deb=$(ls release/*.deb)
      token=$(buildkite-agent secret get PACKAGES_API_TOKEN)
      curl -sf -X POST "https://api.buildkite.com/v2/packages/organizations/miadisabelle/registries/miadi-apt/packages" \
        -H "Authorization: Bearer ${token}" \
        -F "file=@${deb}"
    agents:
      queue: "linux-medium"
